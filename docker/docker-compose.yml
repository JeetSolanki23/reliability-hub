version: '3.8'

services:
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=reliabilityhub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reliabilityhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/reliabilityhub
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8003"

  worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/reliabilityhub
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.workers.health_probe

volumes:
  postgres_data:
